# Builds a debug APK on every push and publishes it as a GitHub release named after the branch
# ("apk-main", "apk-<branch>"), replacing the previous one. The README links to the latest file.
name: APK

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "app/screenshots/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Name the APK
        id: apk
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          short="${GITHUB_SHA::7}"
          echo "tag=apk-$branch" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/FileExplorer-$branch.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FileExplorer-${{ steps.apk.outputs.short }}
          path: out/*.apk
          retention-days: 30

      - name: Publish as release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.apk.outputs.tag }}
          SHORT: ${{ steps.apk.outputs.short }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" out/*.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "APK ($GITHUB_REF_NAME, $SHORT)" \
            --notes "자동 빌드한 디버그 APK입니다. 브랜치: \`$GITHUB_REF_NAME\`, 커밋: $GITHUB_SHA"
